touch_config_file "touch_profiles/phone_ahsim.cfg"

// touch cvars

// _move sensitivity settings
touch_forwardzone "0.124444"
touch_sidezone "0.070000"

// _look sensitivity settings
touch_pitch "50.000000"
touch_yaw "50.000000"

// grid settings
touch_grid_count "50"
touch_grid_enable "1"

// global overstroke (width, r, g, b, a)
touch_set_stroke 1 156 77 20 200

// highlight when pressed
touch_highlight_r "1.000000"
touch_highlight_g "0.500000"
touch_highlight_b "1.000000"
touch_highlight_a "1.000000"

// _joy and _dpad options
touch_dpad_radius "1.000000"
touch_joy_radius "1.000000"

// how much slowdown when Precise Look button pressed
touch_precise_amount "0.500000"

// enable/disable move indicator
touch_move_indicator "3"

// reset menu state when execing config
touch_setclientonly 0

// touch buttons
// 컨트롤러가 기본이다. 게임 동작은 전부 버튼 매핑(userconfig.cfg)에 있고,
// 여기에는 패드에 묶기 애매한 것(구매/팀 변경/무전/채팅/명령 메뉴/봇 메뉴)만 화면 위쪽 가운데에 작게 둔다.
touch_removeall
touch_addbutton "buy" "touch/gfx/buy" "buy" 0.300000 0.010000 0.340000 0.100000 255 255 255 130 0 1
touch_addbutton "change_team" "touch/gfx/change_team" "chooseteam" 0.350000 0.010000 0.390000 0.100000 255 255 255 130 0 1
touch_addbutton "radio" "touch/gfx/radio" "showvguimenu 38" 0.400000 0.010000 0.440000 0.100000 255 255 255 130 0 1
touch_addbutton "say" "touch/gfx/chat_all" "messagemode" 0.450000 0.010000 0.490000 0.100000 255 255 255 130 0 1
touch_addbutton "say2" "touch/gfx/chat_team" "messagemode2" 0.500000 0.010000 0.540000 0.100000 255 255 255 130 0 1
touch_addbutton "cmd" "touch/gfx/cmdmenu" "exec touch/cmd/cmd" 0.550000 0.010000 0.590000 0.100000 255 255 255 130 0 1
touch_addbutton "bots" "touch/gfx/botmenu" "exec touch/bots/bots" 0.600000 0.010000 0.640000 0.100000 255 255 255 130 0 1
touch_addbutton "touch_edit" "touch/gfx/settings" "touch_enableedit" 0.650000 0.010000 0.690000 0.100000 255 255 255 130 0 1
