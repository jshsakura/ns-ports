// ========================================================
// 컨트롤러 자이로 조준 (엔진 기본 변수를 쓴다)
// ========================================================

// 자이로 조준 켜기/끄기 (1: 켬, 0: 끔)
joy_gyro_enable "1"

// 자이로 감도 (1.0 = 움직인 만큼 그대로)
joy_gyro_pitch "0.85"
joy_gyro_yaw "0.85"
joy_gyro_roll "0.0"
// 스코프를 당기면 시야각에 비례해 더 줄인다. 1.0 이면 시야각 비율만큼, 더 크면 더 많이 줄인다.
joy_gyro_zoom "1.2"

// 가만히 있을 때 떨림을 무시하는 범위 (도/초)
joy_gyro_pitch_deadzone "0.5"
joy_gyro_yaw_deadzone "0.5"
joy_gyro_roll_deadzone "0.5"

// 스위치 라이트 본체 자이로(엔진이 libnx 로 직접 읽는다)의 축 지정. x, y, z 중 하나이고 앞에 -를 붙이면 방향이 뒤집힌다.
// 위아래가 반대면 pitch 에 -를, 좌우가 반대면 yaw 에 -를 붙인다. 위아래와 좌우가 뒤바뀌면 두 값을 서로 바꾼다.
// 움직임이 너무 크거나 작으면 위의 joy_gyro_pitch / joy_gyro_yaw 감도를 조절한다.
joy_nx_gyro_pitch "x"
joy_nx_gyro_yaw "y"
joy_nx_gyro_roll "z"

// 콘솔에서 gyro 를 입력하면 켜고 끈다
alias gyro "toggle joy_gyro_enable 0 1"

// 소리가 지직거리면 미리 섞어 두는 길이를 늘린다 (기본 0.12, 늘릴수록 소리가 약간 늦게 난다)
_snd_mixahead "0.2"

// ===== 컨트롤러 버튼 매핑 =====
// config.cfg 의 unbindall 이 엔진 기본 컨트롤러 매핑을 지우므로 여기서 다시 묶는다.
// 엔진 이름 기준이다. 실제 스위치 버튼과 어긋날 수 있어 기기에서 확인이 필요하다.
bind "A_BUTTON" "+use"
bind "B_BUTTON" "+jump"
bind "X_BUTTON" "impulse 100"
bind "Y_BUTTON" "lastinv"
bind "L1_BUTTON" "+duck"
bind "R1_BUTTON" "+reload"
bind "L2_BUTTON" "+attack2"
bind "R2_BUTTON" "+attack"
bind "LTRIGGER" "+attack2"
bind "RTRIGGER" "+attack"
bind "STICK1" "+speed"
// 오른쪽 스틱을 누르고 있는 동안 음성 채팅(마이크가 있어야 한다)
bind "STICK2" "+voicerecord"
bind "DPAD_UP" "buy"
bind "DPAD_DOWN" "drop"
bind "DPAD_LEFT" "invprev"
bind "DPAD_RIGHT" "invnext"
bind "START" "cancelselect"
bind "BACK" "+showscores"
bind "MODE" "chooseteam"
// ===== 컨트롤러 버튼 매핑 끝 =====

// 터치 버튼 글자의 위아래 위치. 클수록 위로 올라간다(줄 높이 단위, 0 이면 버튼 가운데).
// 값을 바꿀 때는 파일 크기도 바뀌게 한다(크기가 같으면 기기가 새로 받지 않는다)
touch_text_lift "0.5"
