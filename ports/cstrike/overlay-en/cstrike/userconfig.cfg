// ========================================================
// Gyro aiming (uses the engine's built-in variables)
// ========================================================

// Gyro aiming on/off (1: on, 0: off)
joy_gyro_enable "1"

// Gyro sensitivity (1.0 = follows your movement 1:1)
joy_gyro_pitch "0.85"
joy_gyro_yaw "0.85"
joy_gyro_roll "0.0"
// While scoped, sensitivity is reduced in proportion to the field of view. Higher values reduce it more.
joy_gyro_zoom "1.2"

// Ignore jitter while holding still (degrees per second)
joy_gyro_pitch_deadzone "0.5"
joy_gyro_yaw_deadzone "0.5"
joy_gyro_roll_deadzone "0.5"

// Axis mapping for the console's own gyro (read directly through libnx): x, y or z, prefix with - to invert.
// If up/down is reversed, put - on pitch. If left/right is reversed, put - on yaw. If they are swapped, swap the two values.
joy_nx_gyro_pitch "x"
joy_nx_gyro_yaw "y"
joy_nx_gyro_roll "z"

// Type "gyro" in the console to toggle it
alias gyro "toggle joy_gyro_enable 0 1"

// If sound crackles, raise the mix-ahead length (default 0.12, higher = slightly more latency)
_snd_mixahead "0.2"

// ===== Controller bindings =====
// config.cfg runs unbindall, which wipes the engine's default controller bindings, so they are bound again here.
bind "A_BUTTON" "+use"
bind "B_BUTTON" "+jump"
bind "X_BUTTON" "impulse 100"
bind "Y_BUTTON" "lastinv"
bind "L1_BUTTON" "+duck"
bind "R1_BUTTON" "+reload"
bind "L2_BUTTON" "+attack2"
bind "R2_BUTTON" "+attack"
bind "LTRIGGER" "+attack2"
bind "RTRIGGER" "+attack"
bind "STICK1" "+speed"
// Hold the right stick to talk on voice chat (needs a headset microphone)
bind "STICK2" "+voicerecord"
bind "DPAD_UP" "buy"
bind "DPAD_DOWN" "drop"
bind "DPAD_LEFT" "invprev"
bind "DPAD_RIGHT" "invnext"
bind "START" "cancelselect"
bind "BACK" "+showscores"
bind "MODE" "chooseteam"
// ===== End of controller bindings =====

// Vertical position of touch button labels. Higher = labels move up (in line heights, 0 = centered).
touch_text_lift "0.5"
