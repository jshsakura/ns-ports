touch_addbutton "_menu_frame_txt_desc1" "#이후 DEVGRU로 알려지는 씰 6팀은 ;1980년 리차드 마친코 소령의 지휘하에 조직되어 ;전세계의 미국 목표물을 테러에 보호하기 위해 항시 가동되고 있습니다." "" 0.390000 0.568889 0.840000 0.835556 255 174 0 255 4
touch_addbutton "_menu_frame_txt_desc2" "#GSG-9는 1972년 독일 뮌헨 올림픽 도중; 발생한 테러리스트 공격으로 이스라엘의;운동 선수들이 희생 당한 이후 결성된 대테러 부대입니다." "" 0.390000 0.568889 0.840000 0.835556 255 174 0 255 4
touch_addbutton "_menu_frame_txt_desc3" "#전세계적으로 유명한 영국의 SAS는 ;제 2차 세계 대전 도중 데이빗 스털링이 세운 조직으로, ;2차 대전 동안 전선 배후에서 정보를 수집하고 ;폭파 공작과  주요 표적을 암살하는 임무를 수행했습니다." "" 0.390000 0.568889 0.840000 0.835556 255 174 0 255 4
touch_addbutton "_menu_frame_txt_desc4" "#프랑스의 엘리트 대테러 부대 GIGN 은 대규모 테러 사건에;결정적으로 대응하는 신속 대응 부대로 만들어졌습니다.;100명 이하로 구성된 GIGN 은 그 명성을 쌓아 왔습니다." "" 0.390000 0.568889 0.840000 0.835556 255 174 0 255 4
if $gamedir == "czero"
:touch_addbutton "_menu_frame_txt_desc5" "#러시아 스페츠나츠의 주요 임무는 다음과 같습니다.;주요 경제·군사 시설의 정보 수집과 파괴 또는 무력화,;파괴 공작과 전복 활동 조직," "" 0.390000 0.568889 0.840000 0.835556 255 174 0 255 4
:touch_addbutton "_menu_frame_txt_desc5a" "#;;;;반란군에 대한 응징 작전 수행, 반군 부대 편성과 훈련 등." "" 0.390000 0.568889 0.840000 0.835556 255 174 0 255 4
:touch_addbutton "_menu_frame_txt_desc6" "#자동 선택을 클릭하면 캐릭터 모델을 임의로 선택하게 됩니다." "" 0.390000 0.568889 0.840000 0.835556 255 174 0 255 4
else
